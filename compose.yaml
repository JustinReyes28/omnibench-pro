services:
  omnibench-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: omnibench-dev
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - AA_API_KEY=${AA_API_KEY:-}
      - HF_TOKEN=${HF_TOKEN:-}
    stdin_open: true
    tty: true
    command: bash
